  SAINT_MARTIN:           { name:'Saint Martin',           category:'TEXTURIZADOS', tag:'Moda Praia · Moda',               bookPages:0 },

  // ── ESTAMPADOS ──────────────────────────────────────────
  SARDINHA:               { name:'Sardinha',               category:'ESTAMPADOS',   tag:'Moda Praia · Moda',               bookPages:0 },
  SARDINHAS:              { name:'Sardinhas',              category:'ESTAMPADOS',   tag:'Moda Praia · Moda',               bookPages:0 },
};

// ══════════════════════════════════════════════════════════
//  ESTADO DO READER
// ══════════════════════════════════════════════════════════
let pages        = [];
let currentSpread = 0;
let totalSpreads  = 0;
let isAnimating   = false;
let activeCategory = null;
let isMobileView  = false;
// Em mobile mostramos uma página por vez
let mobilePages  = [];
let mobilePage   = 0;

// ── UTILITÁRIOS ────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

function checkMobile() {
  isMobileView = window.innerWidth < 700;
}

// ── GERAÇÃO DE PÁGINAS ─────────────────────────────────────
// Cada fabric gera:
//   páginas[even] = intro (esquerda)
//   páginas[even+1] = foto capa do catálogo (direita)
//   páginas[even+2..] = fotos do book (pares)
function generatePages(category) {
  const result = [];

  // Spread 0: [branco | capa do livro]
  result.push({ type: 'blank' });
  result.push({ type: 'book-cover', category });

  const entries = Object.entries(BOOK_DATA).filter(([, f]) => f.category === category);

  entries.forEach(([key, fabric], idx) => {
    // Garante que cada tecido começa numa página esquerda (índice par)
    if (result.length % 2 !== 0) result.push({ type: 'blank' });

    // Página intro (esquerda) + capa do catálogo (direita)
    result.push({ type: 'fabric-intro', key, fabric, fabricIndex: idx });
    result.push({
      type: 'fabric-cover',
      key, fabric,
      src: `images/${category}/${key}/page-01.jpg`
    });

    // Fotos do lookbook
    for (let i = 1; i <= (fabric.bookPages || 0); i++) {
      result.push({
        type: 'fabric-photo',
        key, fabric,
        src: `images/book/${category}/${key}/photo-${pad(i)}.jpg`,
        n: i
      });
    }

    // Pad para manter contagem par
    if (result.length % 2 !== 0) result.push({ type: 'blank' });
  });

  return result;
}

// ── RENDER DE CADA TIPO DE PÁGINA ─────────────────────────
const CAT_LABELS = { LISOS: 'Lisos', TEXTURIZADOS: 'Texturizados', ESTAMPADOS: 'Estampados' };

function renderPage(page) {
  if (!page || page.type === 'blank') return renderBlank();
  switch (page.type) {
    case 'book-cover':    return renderCover(page);
    case 'fabric-intro':  return renderIntro(page);
    case 'fabric-cover':
    case 'fabric-photo':  return renderPhoto(page);
    default:              return renderBlank();
  }
}

function renderBlank() {
  return `<div class="pg pg-blank">
    <div class="pg-blank-watermark">Alfa <em>&</em> Levy</div>
  </div>`;
}

function renderCover(page) {
  const label = CAT_LABELS[page.category] || page.category;
  const count = Object.values(BOOK_DATA).filter(f => f.category === page.category).length;
  return `<div class="pg pg-cover">
    <div class="pg-cover-inner">
      <div class="pg-cover-eyebrow">Lookbook Digital · 2026</div>
      <div class="pg-cover-line"></div>
      <div class="pg-cover-brand">Alfa <em>&</em> Levy</div>
      <div class="pg-cover-cat">${label}</div>
      <div class="pg-cover-count">${count} tecidos</div>
      <div class="pg-cover-line"></div>
      <div class="pg-cover-footer">São Paulo · Brasil</div>
    </div>
  </div>`;
}

function renderIntro(page) {
  const num = pad(page.fabricIndex + 1);
  return `<div class="pg pg-intro">
    <div class="pg-intro-num">${num}</div>
    <div class="pg-intro-body">
      <div class="pg-intro-cat">${CAT_LABELS[page.fabric.category] || page.fabric.category}</div>
      <div class="pg-intro-name">${page.fabric.name}</div>
      <div class="pg-intro-divider"></div>
      <div class="pg-intro-tag">${page.fabric.tag}</div>
    </div>
    <div class="pg-intro-wm">Alfa & Levy</div>
  </div>`;
}

function renderPhoto(page) {
  const isCover = page.type === 'fabric-cover';
  const label = isCover ? page.fabric.name : `Foto ${page.n}`;
  const hasBk = !isCover;
  return `<div class="pg pg-photo ${isCover ? 'pg-photo-cover' : ''}">
    <img src="${page.src}" alt="${page.fabric.name}" loading="${isCover ? 'eager' : 'lazy'}">
    <div class="pg-photo-overlay">
      <span class="pg-photo-label">${label}</span>
      ${hasBk ? `<span class="pg-photo-n">${page.n}</span>` : ''}
    </div>
    ${isCover ? `<div class="pg-photo-tag">${page.fabric.tag}</div>` : ''}
  </div>`;
}

// ── ABRIR / FECHAR BOOK ───────────────────────────────────
function openBook(category, jumpToFabric) {
  checkMobile();
  activeCategory = category;

  pages = generatePages(category);
  totalSpreads = pages.length / 2;

  // Encontra spread inicial
  let startSpread = 0;
  if (jumpToFabric) {
    for (let i = 0; i < pages.length; i++) {
      if (pages[i].key === jumpToFabric && pages[i].type === 'fabric-intro') {
        startSpread = Math.floor(i / 2);
        break;
      }
    }
  }

  // Em mobile: navegação página a página
  mobilePages = pages.filter(p => p && p.type !== 'blank');
  mobilePage = 0;
  if (jumpToFabric) {
    for (let i = 0; i < mobilePages.length; i++) {
      if (mobilePages[i].key === jumpToFabric) { mobilePage = i; break; }
    }
  }

  // Mostra reader
  document.getElementById('landing').style.display = 'none';
  document.getElementById('reader').style.display = 'flex';
  document.getElementById('brHeaderCat').textContent = CAT_LABELS[category] || category;

  // Atualiza link do WhatsApp com categoria
  const wppMsg = `https://wa.me/5511957717470?text=Olá!%20Vi%20o%20lookbook%20de%20${encodeURIComponent(CAT_LABELS[category] || category)}%20e%20gostaria%20de%20mais%20informações.`;
  document.getElementById('brWpp').href = wppMsg;

  currentSpread = startSpread;

  if (isMobileView) {
    renderMobile(mobilePage);
  } else {
    renderSpread(startSpread);
  }
}

function closeBook() {
  document.getElementById('reader').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  isAnimating = false;
  document.getElementById('brFlipper').style.display = 'none';
}

// ── RENDER SPREAD (DESKTOP) ───────────────────────────────
function renderSpread(idx) {
  currentSpread = Math.max(0, Math.min(idx, totalSpreads - 1));
  document.getElementById('pageLeft').innerHTML  = renderPage(pages[currentSpread * 2]);
  document.getElementById('pageRight').innerHTML = renderPage(pages[currentSpread * 2 + 1]);
  document.getElementById('brFlipper').style.display = 'none';
  updateUI();
}

function updateUI() {
  // Fabric ativa
  const left  = pages[currentSpread * 2];
  const right = pages[currentSpread * 2 + 1];
  let fabricName = '';
  for (const p of [right, left]) {
    if (p && p.fabric) { fabricName = p.fabric.name; break; }
  }
  document.getElementById('brHeaderFabric').textContent = fabricName ? '— ' + fabricName : '';
  document.getElementById('brFooterFabric').textContent = fabricName;

  // Progresso
  const pct = totalSpreads > 1 ? (currentSpread / (totalSpreads - 1)) * 100 : 100;
  document.getElementById('brProgressFill').style.width = pct + '%';
  document.getElementById('brProgressLabel').textContent = `${currentSpread + 1} / ${totalSpreads}`;
  document.getElementById('brCounter').textContent = `${currentSpread + 1} / ${totalSpreads}`;

  // Botões
  document.getElementById('btnPrev').disabled = currentSpread <= 0;
  document.getElementById('btnNext').disabled = currentSpread >= totalSpreads - 1;

  // WhatsApp dinâmico ao tecido
  if (fabricName) {
    const wppMsg = `https://wa.me/5511957717470?text=Olá!%20Tenho%20interesse%20no%20tecido%20${encodeURIComponent(fabricName)}%20do%20lookbook.`;
    document.getElementById('brWpp').href = wppMsg;
  }
}

// ── NAVEGAÇÃO COM FLIP (DESKTOP) ──────────────────────────
function nextPage() {
  if (isMobileView) { nextMobile(); return; }
  if (isAnimating || currentSpread >= totalSpreads - 1) return;

  const next = currentSpread + 1;
  const elLeft    = document.getElementById('pageLeft');
  const elRight   = document.getElementById('pageRight');
  const elFlipper = document.getElementById('brFlipper');
  const elFront   = document.getElementById('flipFront');
  const elBack    = document.getElementById('flipBack');

  // Front: página direita atual | Back: próxima página esquerda
  elFront.innerHTML = elRight.innerHTML;
  elBack.innerHTML  = renderPage(pages[next * 2]);

  // Direita já recebe a próxima página direita (por baixo do flipper)
  elRight.innerHTML = renderPage(pages[next * 2 + 1]);

  // Posiciona o flipper na metade direita
  Object.assign(elFlipper.style, {
    left: '50%', top: '0', width: '50%', height: '100%',
    transformOrigin: '0% 50%',
    transform: 'rotateY(0deg)',
    display: 'block'
  });

  isAnimating = true;
  // Força reflow antes de iniciar transição
  void elFlipper.offsetHeight;
  elFlipper.classList.add('br-flipping');

  // Metade do caminho: atualiza página esquerda (está coberta pelo flipper)
  setTimeout(() => {
    elLeft.innerHTML = renderPage(pages[next * 2]);
  }, 360);

  // Fim da animação
  setTimeout(() => {
    elFlipper.classList.remove('br-flipping');
    elFlipper.style.display = 'none';
    currentSpread = next;
    isAnimating = false;
    updateUI();
  }, 720);
}

function prevPage() {
  if (isMobileView) { prevMobile(); return; }
  if (isAnimating || currentSpread <= 0) return;

  const prev = currentSpread - 1;
  const elLeft    = document.getElementById('pageLeft');
  const elRight   = document.getElementById('pageRight');
  const elFlipper = document.getElementById('brFlipper');
  const elFront   = document.getElementById('flipFront');
  const elBack    = document.getElementById('flipBack');

  // Front: página esquerda atual | Back: página direita anterior
  elFront.innerHTML = elLeft.innerHTML;
  elBack.innerHTML  = renderPage(pages[prev * 2 + 1]);

  // Esquerda já recebe a anterior esquerda
  elLeft.innerHTML = renderPage(pages[prev * 2]);

  // Flipper na metade esquerda, gira para a direita
  Object.assign(elFlipper.style, {
    left: '0', top: '0', width: '50%', height: '100%',
    transformOrigin: '100% 50%',
    transform: 'rotateY(0deg)',
    display: 'block'
  });

  isAnimating = true;
  void elFlipper.offsetHeight;
  elFlipper.classList.add('br-flipping-back');

  setTimeout(() => {
    elRight.innerHTML = renderPage(pages[prev * 2 + 1]);
  }, 360);

  setTimeout(() => {
    elFlipper.classList.remove('br-flipping-back');
    elFlipper.style.display = 'none';
    currentSpread = prev;
    isAnimating = false;
    updateUI();
  }, 720);
}

// ── MOBILE: uma página por vez com fade ──────────────────
function renderMobile(idx) {
  mobilePage = Math.max(0, Math.min(idx, mobilePages.length - 1));
  const page = mobilePages[mobilePage];
  const elRight = document.getElementById('pageRight');
  elRight.innerHTML = renderPage(page);
  elRight.style.width = '100%';
  document.getElementById('pageLeft').style.display = 'none';
  document.getElementById('brSpine') && (document.getElementById('brSpine').style.display = 'none');

  // UI
  let fabricName = page && page.fabric ? page.fabric.name : '';
  document.getElementById('brHeaderFabric').textContent = fabricName ? '— ' + fabricName : '';
  document.getElementById('brFooterFabric').textContent = fabricName;
  const pct = mobilePages.length > 1 ? (mobilePage / (mobilePages.length - 1)) * 100 : 100;
  document.getElementById('brProgressFill').style.width = pct + '%';
  document.getElementById('brProgressLabel').textContent = `${mobilePage + 1} / ${mobilePages.length}`;
  document.getElementById('brCounter').textContent = `${mobilePage + 1} / ${mobilePages.length}`;
  document.getElementById('btnPrev').disabled = mobilePage <= 0;
  document.getElementById('btnNext').disabled = mobilePage >= mobilePages.length - 1;
}

function nextMobile() { if (mobilePage < mobilePages.length - 1) renderMobile(mobilePage + 1); }
function prevMobile() { if (mobilePage > 0) renderMobile(mobilePage - 1); }

// ── TECLADO ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('reader').style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
  if (e.key === 'Escape') closeBook();
});

// ── SWIPE (MOBILE / TOUCH) ────────────────────────────────
let touchStartX = 0, touchStartY = 0;
document.getElementById('reader')?.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('reader')?.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) nextPage(); else prevPage();
  }
}, { passive: true });

// ── RESIZE ────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const wasMobile = isMobileView;
    checkMobile();
    if (activeCategory && wasMobile !== isMobileView) {
      // Reconstrói o layout ao mudar entre mobile e desktop
      if (isMobileView) {
        renderMobile(mobilePage);
      } else {
        document.getElementById('pageLeft').style.display = '';
        document.getElementById('pageRight').style.width = '';
        renderSpread(currentSpread);
      }
    }
  }, 200);
});

// ── URL PARAMS: abre direto em categoria/tecido ───────────
window.addEventListener('DOMContentLoaded', () => {
  const params   = new URLSearchParams(location.search);
  const cat      = params.get('category');
  const fabric   = params.get('fabric');
  if (cat) openBook(cat, fabric || null);
});
</script>
